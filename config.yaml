# MedChemAgent configuration.
#
# No secrets belong in this file. The LLM API key is read from the
# OPENAI_API_KEY environment variable (or from an optional JSON auth file via
# llm.auth_file); smina is resolved from PATH unless SMINA_BIN is set.

llm:
  base_url: "https://api.openai.com/v1"   # any OpenAI-compatible endpoint
  api_key_env: "OPENAI_API_KEY"           # env var holding the API key
  auth_file: ""                           # optional JSON file {"OPENAI_API_KEY": "..."}
  model: "gpt-4o"                         # chat model used for the agent loop
  temperature: 0.7
  max_tokens: 3000
  timeout_sec: 180

paths:
  smina_bin: "smina"          # smina on PATH; override with SMINA_BIN env var
  data_dir: "data"
  results_dir: "results"
  pubmed_cache: "data/pubmed_cache"

agent:
  max_rounds: 8
  proposals_per_round: 5
  keep_top: 20
  exhaustiveness: 8          # smina docking exhaustiveness
  smina_cpu: 4               # threads per smina docking (search parallelism)
  workers: 32                # concurrent molecule dockings (pool size)

scoring:
  # weights for the aggregate objective (higher = better). docking is minimized -> normalized.
  docking_weight: 0.35
  qed_weight: 0.25
  sa_weight: 0.20
  admet_weight: 0.20
