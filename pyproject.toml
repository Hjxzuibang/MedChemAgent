[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medchem-agent"
version = "0.1.0"
description = "MedChemAgent: a tool-grounded closed-loop LLM agent for multi-objective hit-to-lead optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jiaxin Hu" },
    { name = "Limeng Tian" },
    { name = "Chen Fang" },
]
keywords = [
    "drug-discovery",
    "hit-to-lead",
    "large-language-model",
    "agent",
    "molecular-docking",
    "multi-objective-optimization",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "rdkit",
    "openai",
    "httpx",
    "rank-bm25",
    "numpy",
    "scipy",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["medchem_agent*"]
